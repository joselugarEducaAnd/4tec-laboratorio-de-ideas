<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" role="img">
<style>text{font-family:Verdana,'DejaVu Sans',Arial,sans-serif;fill:#25243f} .t{font-size:23px;font-weight:700} .s{font-size:17px} .box{fill:#f4f8fb;stroke:#0b5c8a;stroke-width:3} .arr{stroke:#0b5c8a;stroke-width:4;fill:none;marker-end:url(#a)} .return{stroke:#8a4b2a;stroke-width:4;fill:none;stroke-dasharray:9 7;marker-end:url(#b)}</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0b5c8a"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8a4b2a"/></marker></defs><circle cx="500" cy="250" r="82" fill="#e7f0f6" stroke="#0b5c8a" stroke-width="4"/><text class="t" x="500" y="243" text-anchor="middle">Producto</text><text class="s" x="500" y="271" text-anchor="middle">materia · energía</text><rect class="box" x="390" y="25" rx="16" width="220" height="70"/><text class="s" x="500" y="66" text-anchor="middle" font-weight="700">1. Materias primas</text><rect class="box" x="720" y="155" rx="16" width="220" height="70"/><text class="s" x="830" y="196" text-anchor="middle" font-weight="700">2. Fabricación</text><rect class="box" x="610" y="385" rx="16" width="220" height="70"/><text class="s" x="720" y="426" text-anchor="middle" font-weight="700">3. Distribución</text><rect class="box" x="170" y="385" rx="16" width="220" height="70"/><text class="s" x="280" y="426" text-anchor="middle" font-weight="700">4. Uso y reparación</text><rect class="box" x="60" y="155" rx="16" width="220" height="70"/><text class="s" x="170" y="196" text-anchor="middle" font-weight="700">5. Fin de vida</text><path class="arr" d="M615 60 Q760 60 790 150"/><path class="arr" d="M860 230 Q880 330 800 385"/><path class="arr" d="M605 425 Q500 470 395 425"/><path class="arr" d="M200 385 Q120 330 140 230"/><path class="return" d="M170 155 C160 45 280 22 385 35"/><text class="s" x="15" y="35" font-size="15" style="fill:#8a4b2a">reciclar:</text><text class="s" x="15" y="55" font-size="15" style="fill:#8a4b2a">los materiales</text><text class="s" x="15" y="75" font-size="15" style="fill:#8a4b2a">vuelven al principio</text><path class="return" d="M330 385 C360 320 200 320 230 385"/><text class="s" x="280" y="330" text-anchor="middle" font-size="14" style="fill:#8a4b2a">reparar · reutilizar</text>