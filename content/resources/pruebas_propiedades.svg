<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="t d">
<title id="t">Cuatro pruebas sencillas para reconocer propiedades</title>
<desc id="d">Doblar con peso (rigidez y elasticidad), rayar (dureza), doblar hasta el final (tenacidad) y pesar y meter en agua (densidad).</desc>
<style>
text{font-family:Verdana,'DejaVu Sans',Arial,sans-serif;fill:#25243f}
.tit{font-size:18px;font-weight:700;fill:#073f5f}
.lab{font-size:14px;fill:#25243f}
.cap{font-size:14px;fill:#3e4650;font-style:italic}
.panel{fill:#fbfcfd;stroke:#c2d8e6;stroke-width:2}
.mesa{fill:#c9b79c;stroke:#6b5a43;stroke-width:2}
.acero{fill:none;stroke:#7d8890;stroke-width:6;stroke-linecap:round}
.plastico{fill:none;stroke:#d9822b;stroke-width:6;stroke-linecap:round}
.pla{fill:none;stroke:#3f7fbf;stroke-width:9;stroke-linecap:round}
.alu{fill:none;stroke:#a3adb4;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.hilo{stroke:#555;stroke-width:1.5}
.pesa{fill:#555}
</style>
<rect width="1000" height="640" fill="#ffffff"/>

<!-- 1 · Doblar con peso -->
<g transform="translate(20 20)">
<rect class="panel" width="470" height="290" rx="10"/>
<text class="tit" x="16" y="30">1 · Doblar con peso</text>
<rect class="mesa" x="20" y="88" width="120" height="22"/>
<path class="acero" d="M60 85 L140 85 Q250 88 360 102"/>
<line class="hilo" x1="360" y1="102" x2="360" y2="118"/>
<rect class="pesa" x="348" y="118" width="24" height="18" rx="3"/>
<text class="lab" x="200" y="70">acero: se dobla poco</text>
<rect class="mesa" x="20" y="168" width="120" height="22"/>
<path class="plastico" d="M60 165 L140 165 Q240 172 330 208"/>
<line class="hilo" x1="330" y1="208" x2="330" y2="220"/>
<rect class="pesa" x="318" y="220" width="24" height="18" rx="3"/>
<text class="lab" x="200" y="155">plástico: se dobla mucho</text>
<text class="cap" x="16" y="262">Al quitar el peso, las dos vuelven (elásticas).</text>
<text class="cap" x="16" y="280">El acero es más rígido: se deforma menos.</text>
</g>

<!-- 2 · Rayar -->
<g transform="translate(510 20)">
<rect class="panel" width="470" height="290" rx="10"/>
<text class="tit" x="16" y="30">2 · Rayar con un clavo</text>
<path d="M58 62 L100 118" stroke="#7d8890" stroke-width="5" stroke-linecap="round"/>
<path d="M50 54 L68 70" stroke="#555" stroke-width="9" stroke-linecap="round"/>
<rect x="30" y="128" width="120" height="70" fill="#e8c99a" stroke="#8a6a3c" stroke-width="2"/>
<path d="M36 145 q55 -6 108 2 M36 172 q55 6 108 -2 M36 190 q55 -4 108 0" stroke="#c9a46c" stroke-width="1.5" fill="none"/>
<path d="M50 160 L132 156" stroke="#5a3d1e" stroke-width="5" stroke-linecap="round"/>
<rect x="175" y="128" width="120" height="70" fill="#9cc3e6" stroke="#3f7fbf" stroke-width="2"/>
<path d="M195 160 L277 156" stroke="#2a5a8a" stroke-width="2.5" stroke-linecap="round"/>
<rect x="320" y="128" width="120" height="70" fill="#f4f4f2" stroke="#9aa3a8" stroke-width="2"/>
<path d="M326 134 h108" stroke="#ffffff" stroke-width="3"/>
<path d="M340 160 L422 157" stroke="#b9c0c4" stroke-width="1" stroke-linecap="round"/>
<text class="lab" x="90" y="222" text-anchor="middle">pino:</text>
<text class="lab" x="90" y="240" text-anchor="middle">muy marcado</text>
<text class="lab" x="235" y="222" text-anchor="middle">PLA:</text>
<text class="lab" x="235" y="240" text-anchor="middle">se raya</text>
<text class="lab" x="380" y="222" text-anchor="middle">azulejo:</text>
<text class="lab" x="380" y="240" text-anchor="middle">apenas</text>
<text class="cap" x="16" y="270">Dureza: el azulejo es el más duro; el pino, el más blando.</text>
</g>

<!-- 3 · Doblar hasta el final -->
<g transform="translate(20 330)">
<rect class="panel" width="470" height="290" rx="10"/>
<text class="tit" x="16" y="30">3 · Doblar hasta el final (con gafas)</text>
<path class="pla" d="M30 80 L108 160"/>
<path class="pla" d="M130 160 L208 80"/>
<path d="M110 150 l6 6 l-4 5 l7 6 M128 150 l-6 6 l4 5 l-7 6" stroke="#25243f" stroke-width="1.6" fill="none"/>
<path class="alu" d="M255 80 Q340 215 425 80"/>
<text class="lab" x="119" y="200" text-anchor="middle">PLA en tira fina:</text>
<text class="lab" x="119" y="218" text-anchor="middle">se parte de golpe</text>
<text class="lab" x="340" y="200" text-anchor="middle">chapa de aluminio:</text>
<text class="lab" x="340" y="218" text-anchor="middle">se dobla y aguanta</text>
<text class="cap" x="16" y="262">Tenacidad: el aluminio es tenaz; el PLA en tira fina,</text>
<text class="cap" x="16" y="280">frágil.</text>
</g>

<!-- 4 · Pesar y meter en agua -->
<g transform="translate(510 330)">
<rect class="panel" width="470" height="290" rx="10"/>
<text class="tit" x="16" y="30">4 · Pesar y meter en agua</text>
<rect x="30" y="118" width="70" height="26" fill="#e8c99a" stroke="#8a6a3c" stroke-width="2"/>
<rect x="20" y="144" width="90" height="10" fill="#cfd8de" stroke="#555" stroke-width="2"/>
<rect x="30" y="154" width="70" height="30" rx="4" fill="#eef2f5" stroke="#555" stroke-width="2"/>
<text class="lab" x="65" y="175" text-anchor="middle">50 g</text>
<rect x="125" y="118" width="130" height="26" fill="#e8c99a" stroke="#8a6a3c" stroke-width="2"/>
<rect x="135" y="144" width="110" height="10" fill="#cfd8de" stroke="#555" stroke-width="2"/>
<rect x="155" y="154" width="70" height="30" rx="4" fill="#eef2f5" stroke="#555" stroke-width="2"/>
<text class="lab" x="190" y="175" text-anchor="middle">100 g</text>
<text class="lab" x="20" y="212">mismo pino: 0,5 g/cm³ los dos</text>
<rect x="280" y="70" width="160" height="140" fill="#ffffff" stroke="#555" stroke-width="2.5"/>
<rect x="282" y="108" width="156" height="100" fill="#cfe6f7"/>
<rect x="296" y="96" width="54" height="24" fill="#e8c99a" stroke="#8a6a3c" stroke-width="2"/>
<rect x="390" y="172" width="34" height="34" fill="#3f7fbf" stroke="#2a5a8a" stroke-width="2"/>
<text class="lab" x="322" y="232" text-anchor="middle">pino:</text>
<text class="lab" x="322" y="250" text-anchor="middle">flota</text>
<text class="lab" x="410" y="232" text-anchor="middle">PLA macizo:</text>
<text class="lab" x="410" y="250" text-anchor="middle">se hunde</text>
<text class="cap" x="16" y="275">Densidad: es del material, no de la pieza.</text>
</g>
</svg>
