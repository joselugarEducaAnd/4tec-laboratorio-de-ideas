a</text><rect x="360" y="190" width="280" height="62" rx="8" fill="#fff7d6" stroke="#c9a227" stroke-width="2"/><text class="s" x="372" y="216">Matriz de decisión</text><text class="s" x="372" y="240" font-size="14" fill="#60636b" style="fill:#60636b">responsable: Amir</text><rect x="670" y="110" width="280" height="62" rx="8" fill="#fff7d6" stroke="#c9a227" stroke-width="2"/><text class="s" x="682" y="136">Nombre y roles</text><text class="s" x="682" y="160" font-size="14" fill="#60636b" style="fill:#60636b">responsable: Marta</text><rect x="670" y="190" width="280" height="62" rx="8" fill="#fff7d6" stroke="#c9a227" stroke-width="2"/><text class="s" x="682" y="216">Montar el tablero</text><text class="s" x="682" y="240" font-size="14" fill="#60636b" style="fill:#60636b">responsable: Lucía</text><line x1="340" y1="40" x2="340" y2="430" stroke="#c2d8e6" stroke-width="2"/><line x1="650" y1="40" x2="650" y2="430" stroke="#c2d8e6" stroke-width="2"/></svg>