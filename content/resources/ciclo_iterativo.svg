<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img">
<style>text{font-family:Verdana,'DejaVu Sans',Arial,sans-serif;fill:#25243f} .t{font-size:23px;font-weight:700} .s{font-size:17px} .box{fill:#f4f8fb;stroke:#0b5c8a;stroke-width:3} .arr{stroke:#0b5c8a;stroke-width:4;fill:none;marker-end:url(#a)} .return{stroke:#8a4b2a;stroke-width:4;fill:none;stroke-dasharray:9 7;marker-end:url(#b)}</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0b5c8a"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8a4b2a"/></marker></defs><circle cx="500" cy="230" r="105" fill="#e7f0f6" stroke="#0b5c8a" stroke-width="4"/><text class="t" x="500" y="224" text-anchor="middle">Iteración</text><text class="s" x="500" y="252" text-anchor="middle">cada vuelta, mejor</text><rect class="box" x="375" y="12" rx="18" width="250" height="76"/><text class="t" x="500" y="46" text-anchor="middle">IDEAR</text><text class="s" x="500" y="74" text-anchor="middle">qué vamos a probar</text><rect class="box" x="705" y="192" rx="18" width="250" height="76"/><text class="t" x="830" y="226" text-anchor="middle">PROTOTIPAR</text><text class="s" x="830" y="254" text-anchor="middle">versión rápida y barata</text><rect class="box" x="375" y="372" rx="18" width="250" height="76"/><text class="t" x="500" y="406" text-anchor="middle">PROBAR</text><text class="s" x="500" y="434" text-anchor="middle">con personas reales</text><rect class="box" x="45" y="192" rx="18" width="250" height="76"/><text class="t" x="170" y="226" text-anchor="middle">MEJORAR</text><text class="s" x="170" y="254" text-anchor="middle">corregir lo que falla</text><path class="arr" d="M625 50 C770 55 820 110 830 190"/><path class="arr" d="M830 270 C815 350 720 403 625 410"/><path class="arr" d="M375 410 C280 403 185 350 170 270"/><path class="arr" d="M170 190 C185 110 280 55 375 50"/></svg>